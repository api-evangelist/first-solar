aid: first-solar
name: First Solar
description: >-
  First Solar, Inc. (NASDAQ: FSLR) is the largest American manufacturer of solar modules and the leading
  producer of thin-film cadmium telluride (CdTe) photovoltaic technology, an alternative to conventional
  crystalline silicon. It designs and manufactures Series 6 and Series 7 modules at vertically integrated
  factories in Ohio, Alabama, Louisiana, India, Malaysia and Vietnam, and supports utility-scale PV projects
  with energy prediction, plant design and post-sales technical services. First Solar publishes no public
  API, developer program or machine-readable contract. Its "Developer Portal" is a Salesforce Experience
  Cloud site for solar project developers and EPC partners, not software developers, and requires a login.
  PlantPredict, the energy-modelling API and Python SDK First Solar built, was acquired by Terabase Energy
  in October 2021 and is catalogued against Terabase.
